[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfact"
version = "0.1.0.dev0"
description = "A reusable framework and dataset for failure-informed LLM shortest-path reasoning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["networkx>=3.2,<4", "numpy>=1.26,<3"]

[project.scripts]
pathfact = "pathfact.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
